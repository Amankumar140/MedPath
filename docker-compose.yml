services:
  # ============================================================================
  # 1. DATABASE (PostgreSQL)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: medpath_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medpath}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medpath"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medpath_network

  # ============================================================================
  # 2. CACHE & MEMORY (Redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: medpath_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medpath_network

  # ============================================================================
  # 3. LLM CONTEXT MICROSERVICE (FastAPI / Python)
  # ============================================================================
  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: medpath_llm
    restart: unless-stopped
    ports:
      - "${LLM_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medpath_network

  # ============================================================================
  # 4. BACKEND API SERVICE (Express / Node.js)
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medpath_server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - API_PREFIX=/api/v1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-medpath}?schema=public
      - REDIS_URL=redis://redis:6379
      - PYTHON_MICROSERVICE_URL=http://llm:8000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - JWT_SECRET=${JWT_SECRET:-medpath_super_secret_jwt_key_change_me_in_production}
      - SESSION_SECRET=${SESSION_SECRET:-medpath_super_secret_session_key_change_me_in_production}
      - SWASTHYA_API_URL=${SWASTHYA_API_URL:-https://swasthya-ai-core.onrender.com}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm:
        condition: service_started
    networks:
      - medpath_network

  # ============================================================================
  # 5. FRONTEND SPA (React / Vite / Nginx)
  # ============================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    container_name: medpath_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - server
    networks:
      - medpath_network

volumes:
  postgres_data:
    name: medpath_postgres_data
  redis_data:
    name: medpath_redis_data

networks:
  medpath_network:
    name: medpath_network
    driver: bridge
