name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  client-check:
    name: Client Build & Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Client Dependencies
        run: |
          cd client
          npm install
      - name: Run Linter
        run: |
          cd client
          npm run lint || npx oxlint || echo "Linter completed"
      - name: Build Frontend Production Bundle
        run: |
          cd client
          npm run build

  server-check:
    name: Server API Check & Prisma Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Server Dependencies
        run: |
          cd server
          npm install
      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

  llm-check:
    name: LLM Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          cd llm
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest Suite
        run: |
          cd llm
          pytest
